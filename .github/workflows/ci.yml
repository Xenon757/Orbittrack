# Runs the type checker and the full test suite on every push and pull request.
# The tests never touch the network (they use the TLE file in tests/fixtures/), so CI results
# are deterministic and don't depend on CelesTrak being reachable.
name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version-file: .python-version
          cache: pip
          cache-dependency-path: requirements*.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Type check
        run: mypy

      - name: Run tests
        run: pytest -q
